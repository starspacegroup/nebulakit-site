name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.3.14'

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Check coverage threshold (90%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Coverage is below 90%!"
            exit 1
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Build & Deploy is handled by the Cloudflare Pages Git integration, not here.
  # See: https://dash.cloudflare.com → Pages → nebulakit-site. Pushes to main
  # publish to https://nebulakit.starspace.group.
  #
  # This is a DERIVED project, so unlike the NebulaKit template it has its own
  # real Cloudflare resource ids in wrangler.toml and the `prebuild` binding
  # guard passes. Never paste an id from another project — a wrong id binds
  # cleanly to somebody else's data and looks perfectly healthy. See
  # docs/CLOUDFLARE_SETUP.md for the incident that rule came from.
  #
  # NOTE: bun.lock is the sole lockfile; package-lock.json was removed so the two
  # can no longer drift. The Pages build command installs with bun to match.
